<style>

:root[data-theme="dark"]{--bg:#0C1626;--surface:#14233A;--ink:#E8EEF4;--muted:#A3B3C4;--line:#2A3C55;--teal:#2BB7BB;--teal-ink:#5CD0D3;--amber-bg:#3A2D14;--amber-ink:#F6C26B;--ok:#5CC08A;--ok-bg:#16352A;--bad:#FF8A80;--bad-bg:#3E1D1B;--nav:#0A111E;--paper:#F4F7F9;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:1040px;margin:0 auto}
header.top{background:var(--nav);color:var(--on-nav);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.insts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.slot img{height:34px;width:auto;display:block}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px}.brand b{color:var(--amber)}
.sep{width:1px;height:28px;background:rgba(255,255,255,.3)}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.who .chip{background:rgba(255,255,255,.14);border-radius:20px;padding:4px 12px}
.lnk{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1{font-size:26px;margin:0 0 6px;line-height:1.15;text-wrap:balance}h2{font-size:19px;margin:0 0 8px;text-wrap:balance}h3{font-size:16px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 16px}.small{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card.next{border-color:var(--amber);background:var(--amber-bg)}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:820px){.grid.two{grid-template-columns:1.1fr .9fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.hero{display:grid;gap:18px;grid-template-columns:1fr;align-items:center;margin-bottom:18px}
@media(min-width:820px){.hero{grid-template-columns:1.15fr .85fr}}
.hero svg{width:100%;height:auto;display:block}
.how{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 18px;padding:0;list-style:none}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:13.5px;line-height:1.2}
.how svg{width:44px;height:44px;display:block;margin:0 auto 6px}
@media(max-width:560px){.how{grid-template-columns:repeat(2,1fr)}}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
input[aria-invalid="true"]{border-color:var(--bad)}textarea{min-height:84px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:3px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--teal);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;width:100%;margin-top:12px}
.btn.alt{background:transparent;color:var(--teal-ink);border:2px solid var(--teal)}.btn.bad{background:var(--bad);color:#fff}.btn.sm{width:auto;min-height:40px;margin:0;padding:0 14px;font-size:15px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1 1 140px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.wait{background:var(--amber-bg);color:var(--amber-ink)}.pill.no{background:var(--bad-bg);color:var(--bad)}.pill.idle{background:var(--line);color:var(--muted)}
.alert{border-radius:10px;padding:10px 12px;font-size:15px;margin:10px 0 0}.alert.err{background:var(--bad-bg);color:var(--bad)}.alert.okk{background:var(--ok-bg);color:var(--ok)}.alert.info{background:var(--amber-bg);color:var(--amber-ink)}
.steps{list-style:none;margin:0;padding:0}.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;position:relative;padding-bottom:14px}.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:19px;top:40px;bottom:-2px;width:2px;background:var(--line)}.steps li:last-child::before{display:none}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);z-index:1}.dot svg{width:24px;height:24px}
.done .dot{background:var(--ok-bg);border-color:var(--ok)}.now .dot{background:var(--amber-bg);border-color:var(--amber)}
.steps .t{font-weight:700;display:block}.steps .s{font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}th{font-size:13px;text-align:left;color:var(--muted);padding:6px;border-bottom:2px solid var(--line)}td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}tr.late td{background:var(--amber-bg)}.scroll{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:15px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;padding:9px 14px;border-radius:20px;cursor:pointer;min-height:42px}.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700;border-color:var(--ink)}
.paper{background:var(--paper);color:#14294B;border:1px solid #B9CAD3;border-radius:6px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.paper h3{font-size:17px;text-align:center;margin:8px 0 2px}.paper .ph{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:2px solid #0D9CA0;padding-bottom:8px;font-size:12.5px;font-weight:700}
.paper .wm{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:700;color:rgba(179,38,30,.10);transform:rotate(-24deg);pointer-events:none;text-align:center;line-height:1.1}
.paper table{font-size:14px}.paper td,.paper th{border-color:#D5E0E6;color:#14294B}.paper th{background:#EEF5F7}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere}
.seal{font-size:11.5px;color:#44566C;border-top:1px dashed #9FB0C2;margin-top:10px;padding-top:6px}
.mail{border-left:3px solid var(--teal);padding:2px 0 2px 10px;margin:10px 0;font-size:15px}.mail small{color:var(--muted)}
.accs{font-size:14px}.accs td{padding:6px 4px}.accs code{background:var(--bg);padding:1px 5px;border-radius:5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;max-width:min(440px,calc(100vw - 32px));font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20}
.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.stat>div{flex:1 1 130px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:15px}.chk i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:#fff;margin-top:1px}.chk .y{background:var(--ok)}.chk .n{background:var(--bad)}
.cardform{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}.cardform .full{grid-column:1/-1}
.foot{margin-top:22px;font-size:13px;color:var(--muted);text-align:center}
</style>
<div class="wrap"><header class="top"><div class="top-in" id="topbar"></div></header><main id="view"></main><p class="foot">Prototipo con datos y documentos simulados, sin validez fiscal ni oficial. Desarrollado por ResiTrack Soluciones para el Tecnológico Nacional de México, Campus Matehuala.</p></div>

<script>
(function(){
'use strict';
/* ===== Logos del cliente: pega aquí los archivos oficiales como data URI (PNG o SVG) ===== */
var LOGOS={tecnm:'',itm:''};

/* ===== Utilidades ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function uuid(){var b=new Uint8Array(16);(window.crypto||{getRandomValues:function(a){for(var i=0;i<a.length;i++)a[i]=Math.random()*256}}).getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;var h=Array.prototype.map.call(b,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');return (h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20)).toUpperCase()}

function luhnDigit(base){for(var d=0;d<10;d++)if(luhn(base+d))return d}
var clock={shift:0};function NOW(){return Date.now()+clock.shift}
var DAY=86400000,MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fdate(t){var d=new Date(t);return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear()}
function ftime(t){var d=new Date(t);return fdate(t)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function bizDays(from,to){var n=0,d=new Date(from);d.setHours(0,0,0,0);var e=new Date(to);e.setHours(0,0,0,0);while(d<e){d=new Date(d.getTime()+DAY);var w=d.getDay();if(w!==0&&w!==6)n++}return n}
function money(n){return '$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}
var CARRERAS=['Ingeniería en Sistemas Computacionales','Ingeniería Civil','Ingeniería Industrial'];
var PRECIO=100;

/* ===== Capa de datos: modelo relacional con restricciones ===== */
var DB={t:{},meta:{seq:{},clock:0}};
var SCHEMA={
 usuarios:{pk:'id',unique:['usuario'],req:['usuario','nombre','rol','salt','hash'],check:{rol:['residente','finanzas','escolares','coord','vinculacion']}},
 residentes:{pk:'control',unique:['usuario_id'],fk:{usuario_id:'usuarios'},req:['control','nombre','carrera','correo'],check:{carrera:CARRERAS}},
 solicitudes:{pk:'id',fk:{control:'residentes'},req:['control','proyecto','empresa','estado'],check:{estado:['registrada','pagada','facturada','constancia','rechazada','autorizada','carta']}},
 pagos:{pk:'id',unique:['referencia'],fk:{solicitud_id:'solicitudes'},req:['solicitud_id','referencia','monto','vence','estatus'],check:{estatus:['pendiente','por_conciliar','aprobado','rechazado','vencido']}},
 fiscales:{pk:'solicitud_id',fk:{solicitud_id:'solicitudes'},req:['rfc','nombre','cp','uso']},
 facturas:{pk:'id',unique:['uuid','pago_id'],fk:{pago_id:'pagos'},req:['pago_id','uuid','total']},
 documentos:{pk:'id',unique:['folio'],fk:{solicitud_id:'solicitudes'},req:['solicitud_id','tipo','folio','hash'],check:{tipo:['constancia','carta']}},
 bitacora:{pk:'id',fk:{solicitud_id:'solicitudes'},req:['accion','usuario','rol']},
 correos:{pk:'id',fk:{usuario_id:'usuarios'},req:['usuario_id','asunto']}
};
function dbErr(m){var e=new Error(m);e.code='DB';return e}
function nextId(t){DB.meta.seq[t]=(DB.meta.seq[t]||0)+1;return DB.meta.seq[t]}
function all(t){return DB.t[t]||(DB.t[t]=[])}
function find(t,f){var a=all(t);for(var i=0;i<a.length;i++)if(f(a[i]))return a[i];return null}
function where(t,f){return all(t).filter(f)}
function insert(t,row){
  var S=SCHEMA[t];if(!DB.t[t])DB.t[t]=[];
  if(S.pk==='id'&&row.id==null)row.id=nextId(t);
  S.req.forEach(function(c){if(row[c]===undefined||row[c]===null||row[c]==='')throw dbErr('Falta el campo obligatorio '+c+' en '+t)});
  Object.keys(S.check||{}).forEach(function(c){if(S.check[c].indexOf(row[c])<0)throw dbErr('Valor no permitido en '+t+'.'+c)});
  [S.pk].concat(S.unique||[]).forEach(function(c){if(find(t,function(r){return r[c]===row[c]}))throw dbErr('Ya existe un registro con el mismo '+c+' en '+t)});
  Object.keys(S.fk||{}).forEach(function(c){var ref=SCHEMA[S.fk[c]].pk;if(!find(S.fk[c],function(r){return r[ref]===row[c]}))throw dbErr('Llave foránea inválida: '+t+'.'+c)});
  all(t).push(row);persist();return row;
}
function update(t,row,patch){var S=SCHEMA[t];Object.keys(patch).forEach(function(k){if(k==='id'||k===S.pk)return;if(S.check&&S.check[k]&&S.check[k].indexOf(patch[k])<0)throw dbErr('Valor no permitido en '+t+'.'+k);row[k]=patch[k]});persist();return row}
function persist(){try{localStorage.setItem('resitrack_db_v2',JSON.stringify(DB))}catch(e){}}
function loadDb(){try{var s=localStorage.getItem('resitrack_db_v2');if(s){DB=JSON.parse(s);return true}}catch(e){}return false}
function resetDb(){try{localStorage.removeItem('resitrack_db_v2')}catch(e){}DB={t:{},meta:{seq:{},clock:0}};seed()}

/* ===== Servicios del sistema (reglas de negocio y permisos) ===== */
var ROLE_NAME={residente:'Residente',finanzas:'Recursos Financieros',escolares:'Servicios Escolares',coord:'Coordinación de carrera',vinculacion:'Gestión Tecnológica y Vinculación'};
function deny(m){var e=new Error(m||'No tienes permiso para esta acción.');e.code='403';return e}
function need(sess,roles){if(!sess||roles.indexOf(sess.rol)<0)throw deny()}
function bad(m){var e=new Error(m);e.code='VAL';return e}
function log(sol,sess,accion,detalle){insert('bitacora',{solicitud_id:sol.id,fecha:NOW(),usuario:sess.usuario,rol:sess.rol,accion:accion,detalle:detalle||''})}
function mail(userId,asunto,cuerpo){insert('correos',{usuario_id:userId,fecha:NOW(),asunto:asunto,cuerpo:cuerpo,leido:false})}
function touch(sol,estado){update('solicitudes',sol,{estado:estado,actualizada:NOW()})}
function solOf(sess){var r=find('residentes',function(x){return x.usuario_id===sess.id});return r?where('solicitudes',function(s){return s.control===r.control})[0]||null:null}
function ownSol(sess,id){var s=find('solicitudes',function(x){return x.id===id});if(!s)throw bad('La solicitud no existe.');if(sess.rol==='residente'){var r=find('residentes',function(x){return x.usuario_id===sess.id});if(!r||r.control!==s.control)throw deny('Solo puedes ver y modificar tu propio trámite.')}return s}
function resOf(sol){return find('residentes',function(r){return r.control===sol.control})}
function requisitos(r){return[
 ['Servicio social acreditado',r.servicio_social],['Actividades complementarias acreditadas',r.actividades],
 ['Al menos 80 % de los créditos ('+r.creditos+' % actual)',r.creditos>=80],['Ninguna asignatura en curso especial',!r.curso_especial]]}
var Svc={
 login:function(usuario,pass){
  usuario=String(usuario||'').trim();
  if(!usuario||!pass)throw bad('Escribe tu usuario y tu contraseña.');
  var u=find('usuarios',function(x){return x.usuario.toLowerCase()===usuario.toLowerCase()});
  if(!u)throw bad('Usuario o contraseña incorrectos.');
  if(u.bloqueado_hasta&&u.bloqueado_hasta>NOW())throw bad('Cuenta bloqueada por intentos fallidos. Intenta de nuevo en '+Math.ceil((u.bloqueado_hasta-NOW())/60000)+' minutos.');
  if(sha256(u.salt+pass)!==u.hash){u.intentos=(u.intentos||0)+1;if(u.intentos>=3){u.bloqueado_hasta=NOW()+5*60000;u.intentos=0;persist();throw bad('Demasiados intentos. La cuenta se bloqueó por 5 minutos.')}persist();throw bad('Usuario o contraseña incorrectos. Intento '+u.intentos+' de 3.')}
  u.intentos=0;u.bloqueado_hasta=null;persist();
  return{id:u.id,usuario:u.usuario,nombre:u.nombre,rol:u.rol,carrera:u.carrera||null};
 },
 registrar:function(sess,d){
  need(sess,['residente']);
  var r=find('residentes',function(x){return x.usuario_id===sess.id});if(!r)throw deny();
  if(solOf(sess))throw bad('Ya tienes una solicitud registrada.');
  if(String(d.control).trim()!==r.control)throw bad('El número de control no coincide con tu cuenta.');

  if(p.length<10||p.length>150)throw bad('El nombre del proyecto debe tener entre 10 y 150 caracteres.');
  if(e.length<3||e.length>100)throw bad('Escribe el nombre de la empresa donde harás tu residencia (3 a 100 caracteres).');

 pagarTarjeta:function(sess,id,c){

  var now=new Date(NOW()),y=2000+(+m[2]),exp=new Date(y,+m[1],0,23,59);

function histHtml(s){var b=where('bitacora',function(x){return x.solicitud_id===s.id}).sort(function(a,c){return c.fecha-a.fecha});return '<h3 style="margin-top:12px">Historial</h3>'+b.map(function(x){return '<div class="mail"><b>'+esc(x.accion)+'</b>'+(x.detalle?'<br>'+esc(x.detalle):'')+'<br><small>'+ftime(x.fecha)+' · '+esc(x.usuario)+' ('+esc(ROLE_NAME[x.rol])+')</small></div>'}).join('')}
function tableSol(rows,cols,empty){
  if(!rows.length)return '<div class="card">'+emptyArt()+'<p class="small" style="text-align:center">'+empty+'</p></div>';
  var h='<div class="card scroll"><table><thead><tr>'+cols.map(function(c){return '<th>'+c[0]+'</th>'}).join('')+'</tr></thead><tbody>';
  rows.forEach(function(s){var late=idleDays(s)>3&&s.estado!=='carta';h+='<tr class="'+(late?'late':'')+'">'+cols.map(function(c){return '<td>'+c[1](s)+'</td>'}).join('')+'</tr>'});
  return h+'</tbody></table></div>';
}
var cName=function(s){var r=resOf(s);return esc(r.nombre)+'<br><span class="small">'+esc(r.control)+'</span>'},cCar=function(s){return esc(resOf(s).carrera.replace('Ingeniería ',''))},cIdle=function(s){var d=idleDays(s);return d>3?'<b>'+d+'</b>':d},cBtn=function(label){return function(s){return '<button class="btn sm" data-a="sel" data-id="'+s.id+'" type="button">'+label+'</button>'}};
function vFin(){
  var tabs=[['conc','Por conciliar'],['fact','Por facturar'],['emit','Facturas emitidas'],['todos','Todos los pagos']];if(!UI.ft)UI.ft='conc';
  var pagos=all('pagos'),pc=pagos.filter(function(p){return p.estatus==='por_conciliar'}),pf=pagos.filter(function(p){return p.estatus==='aprobado'&&!find('facturas',function(f){return f.pago_id===p.id})});
  var h='<h1>Recursos Financieros</h1><p class="lead">Concilia pagos hechos en el banco y emite las facturas.</p><div class="stat"><div><span class="small">Por conciliar</span><div class="big">'+pc.length+'</div></div><div><span class="small">Por facturar</span><div class="big">'+pf.length+'</div></div><div><span class="small">Facturas emitidas</span><div class="big">'+all('facturas').length+'</div></div></div>';
  h+='<div class="tabs" role="group">'+tabs.map(function(t){return '<button type="button" data-a="ftab" data-t="'+t[0]+'" aria-pressed="'+(UI.ft===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>'+(UI.msg?alertHtml():'');
  function solOfPago(p){return find('solicitudes',function(s){return s.id===p.solicitud_id})}
  if(UI.ft==='conc'){
    h+='<div class="grid two"><div>'+(pc.length?'<div class="card scroll"><table><thead><tr><th>Residente</th><th>Referencia</th><th>Informó</th></tr></thead><tbody>'+pc.map(function(p){var s=solOfPago(p);return '<tr><td>'+cName(s)+'</td><td class="mono">'+fmtRef(p.referencia)+'</td><td>'+fdate(p.creada)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="card">'+emptyArt()+'<p class="small" style="text-align:center">No hay pagos pendientes de conciliar.</p></div>')+'</div>';
    h+='<form class="card" id="f-con" autocomplete="off"><h2>Conciliar depósito</h2><p class="small" style="margin:0">Captura lo que aparece en el estado de cuenta del banco.</p><label for="k-r">Referencia (14 dígitos)</label><input id="k-r" inputmode="numeric" placeholder="88 24000005 001 X"><label for="k-m">Importe depositado</label><input id="k-m" inputmode="decimal" placeholder="100.00"><label for="k-o">Número de operación del banco</label><input id="k-o" inputmode="numeric" placeholder="6 a 12 dígitos"><label for="k-f">Fecha del depósito</label><input id="k-f" type="date"><button class="btn" type="submit">Conciliar pago</button></form></div>';
  }
  if(UI.ft==='fact'){
    h+=pf.length?'<div class="card scroll"><table><thead><tr><th>Residente</th><th>Pago</th><th>Datos fiscales</th><th></th></tr></thead><tbody>'+pf.map(function(p){var s=solOfPago(p),fi=find('fiscales',function(x){return x.solicitud_id===s.id});return '<tr><td>'+cName(s)+'</td><td>'+money(p.monto)+'<br><span class="small">'+esc(p.metodo)+' · '+esc(p.autorizacion||'')+'</span></td><td>'+(fi?'<span class="pill ok">Capturados</span><br><span class="small mono">'+esc(fi.rfc)+'</span>':'<span class="pill no">Faltan</span>')+'</td><td><button class="btn sm" data-a="facturar" data-id="'+p.id+'" type="button"'+(fi?'':' disabled')+'>Emitir factura</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="card">'+emptyArt()+'<p class="small" style="text-align:center">No hay pagos pendientes de factura.</p></div>';
  }
  if(UI.ft==='emit'){var fs=all('facturas');h+=fs.length?'<div class="card scroll"><table><thead><tr><th>Folio</th><th>Receptor</th><th>Total</th><th>Fecha</th></tr></thead><tbody>'+fs.map(function(f){return '<tr><td>'+esc(f.serie_folio)+'<br><span class="small mono">'+esc(f.uuid.slice(0,13))+'…</span></td><td>'+esc(f.nombre)+'<br><span class="small mono">'+esc(f.rfc)+'</span></td><td>'+money(f.total)+'</td><td>'+fdate(f.fecha)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="card">'+emptyArt()+'<p class="small" style="text-align:center">Todavía no hay facturas.</p></div>'}
  if(UI.ft==='todos'){h+='<div class="card scroll"><table><thead><tr><th>Residente</th><th>Referencia</th><th>Método</th><th>Estado</th></tr></thead><tbody>'+pagos.map(function(p){var s=solOfPago(p);return '<tr><td>'+cName(s)+'</td><td class="mono">'+fmtRef(p.referencia)+'</td><td>'+esc(p.metodo||'—')+'</td><td>'+payBadge(p)+'</td></tr>'}).join('')+'</tbody></table></div>'}
  return h;
}
function vSel(estado,titulo,btnLabel,action,extra){
  var rows=where('solicitudes',function(s){return s.estado===estado&&(!extra||extra(s))});
  var h='<h1>'+titulo+'</h1><p class="lead">Revisa el expediente y emite el documento con su folio.</p><div class="stat"><div><span class="small">Pendientes</span><div class="big">'+rows.length+'</div></div></div>'+(UI.msg?alertHtml():'');
  h+=tableSol(rows,[['Residente',cName],['Carrera',cCar],['Días sin cambio',cIdle],['',cBtn('Revisar')]],'No hay trámites pendientes.');
  var s=UI.selected&&find('solicitudes',function(x){return x.id===UI.selected&&x.estado===estado});
  if(s){var r=resOf(s),p=where('pagos',function(x){return x.solicitud_id===s.id&&x.estatus==='aprobado'})[0],fa=p&&find('facturas',function(f){return f.pago_id===p.id});
    h+='<div class="card"><h2>Expediente de '+esc(r.nombre)+'</h2><dl class="kv"><dt>Control</dt><dd>'+esc(r.control)+'</dd><dt>Carrera</dt><dd>'+esc(r.carrera)+'</dd><dt>Proyecto</dt><dd>'+esc(s.proyecto)+'</dd><dt>Empresa</dt><dd>'+esc(s.empresa)+'</dd></dl><h3 style="margin-top:10px">Verificación</h3>'+requisitos(r).map(function(q){return '<div class="chk"><i class="'+(q[1]?'y':'n')+'">'+(q[1]?'&#10003;':'!')+'</i><span>'+esc(q[0])+'</span></div>'}).join('')+'<div class="chk"><i class="'+(p?'y':'n')+'">'+(p?'&#10003;':'!')+'</i><span>Pago aprobado '+(p?'('+money(p.monto)+')':'')+'</span></div><div class="chk"><i class="'+(fa?'y':'n')+'">'+(fa?'&#10003;':'!')+'</i><span>Factura emitida '+(fa?esc(fa.serie_folio):'')+'</span></div>'+histHtml(s)+'<button class="btn" data-a="'+action+'" data-id="'+s.id+'" type="button">'+btnLabel+'</button></div>';}
  return h;
}
function vCoord(){
  var mine=where('solicitudes',function(s){return resOf(s).carrera===SESS.carrera});
  var pend=mine.filter(function(s){return s.estado==='constancia'});
  var h='<h1>Solicitudes de '+esc(SESS.carrera)+'</h1><p class="lead">Solo ves a los residentes de tu carrera. Los trámites con más de 3 días hábiles sin cambio aparecen resaltados.</p><div class="stat"><div><span class="small">Por autorizar</span><div class="big">'+pend.length+'</div></div><div><span class="small">Residentes con trámite</span><div class="big">'+mine.length+'</div></div></div>'+(UI.msg?alertHtml():'');
  h+=tableSol(mine,[['Residente',cName],['Estado',stBadge],['Días sin cambio',cIdle],['',function(s){return s.estado==='constancia'?'<button class="btn sm" data-a="sel" data-id="'+s.id+'" type="button">Revisar</button>':''}]],'Todavía no hay trámites de tu carrera.');
  var s=UI.selected&&find('solicitudes',function(x){return x.id===UI.selected&&x.estado==='constancia'&&resOf(x).carrera===SESS.carrera});
  if(s){var r=resOf(s);h+='<div class="card"><h2>Revisar solicitud</h2><dl class="kv"><dt>Residente</dt><dd>'+esc(r.nombre)+' ('+esc(r.control)+')</dd><dt>Proyecto</dt><dd>'+esc(s.proyecto)+'</dd><dt>Empresa</dt><dd>'+esc(s.empresa)+'</dd></dl>'+requisitos(r).map(function(q){return '<div class="chk"><i class="'+(q[1]?'y':'n')+'">'+(q[1]?'&#10003;':'!')+'</i><span>'+esc(q[0])+'</span></div>'}).join('')+histHtml(s)+'<label for="mot">Motivo (obligatorio si devuelves la solicitud)</label><textarea id="mot" placeholder="Ejemplo: falta la firma de tu asesor"></textarea><div class="row"><button class="btn" data-a="autorizar" data-id="'+s.id+'" type="button">Autorizar</button><button class="btn bad" data-a="rechazar" data-id="'+s.id+'" type="button">Devolver con motivo</button></div></div>'}
  return h;
}
function vStaff(){
  if(SESS.rol==='finanzas')return vFin();
  if(SESS.rol==='escolares')return vSel('facturada','Servicios Escolares','Validar y emitir constancia','constancia');
  if(SESS.rol==='coord')return vCoord();
  if(SESS.rol==='vinculacion')return vSel('autorizada','Gestión Tecnológica y Vinculación','Validar y emitir carta de presentación','carta');
  return '';
}
function render(){
  topbar();
  var v=$('view');
  v.innerHTML=!SESS?vLogin():(SESS.rol==='residente'?vRes():vStaff());
  window.scrollTo(0,0);
}

/* ===== Eventos ===== */
function run(fn,ok){try{fn();if(ok)toast(ok);return true}catch(e){setMsg(e.message,e.code==='403'?'err':'err');return false}}
document.addEventListener('submit',function(ev){
  ev.preventDefault();var id=ev.target.id;UI.msg=null;UI.msgFis=null;
  if(id==='f-login'){try{SESS=Svc.login($('lu').value,$('lp').value);try{sessionStorage.setItem('resitrack_sess',JSON.stringify(SESS))}catch(e){}UI={view:'home',tab:'tramite',pay:'tarjeta'};render()}catch(e){setMsg(e.message);render();$('lu').value=''}return}
  if(id==='f-ver'){var o=$('ver-out');try{var d=Svc.verificar($('fv').value);o.innerHTML='<div class="alert '+(d.ok?'okk':'err')+'" role="status"><b>'+(d.ok?'Documento auténtico':'La huella no coincide')+'</b><br>Tipo: '+esc(d.tipo)+' · Folio: '+esc(d.folio)+'<br>Emitido el '+ftime(d.fecha)+' por '+esc(d.por||'el sistema')+(d.carrera?'<br>Carrera: '+esc(d.carrera):'')+(d.uuid?'<br>UUID: '+esc(d.uuid):'')+'<br>Datos personales no se muestran.</div>'}catch(e){o.innerHTML='<div class="alert err" role="alert">'+esc(e.message)+'</div>'}return}
  if(id==='f-reg'){var sol;if(run(function(){sol=Svc.registrar(SESS,{control:$('g-ctl').value,correo:$('g-cor').value,proyecto:$('g-pro').value,empresa:$('g-emp').value})},'Solicitud registrada. Se generó tu referencia de pago.')){UI.view='pago';UI.msg=null}render();return}
  if(id==='f-card'){var s=solOf(SESS);var ok=run(function(){Svc.pagarTarjeta(SESS,s.id,{numero:$('c-n').value,vence:$('c-v').value,cvv:$('c-c').value,nombre:$('c-m').value})},'Pago aprobado (simulado).');render();return}
  if(id==='f-fis'){var s2=solOf(SESS);try{Svc.fiscales(SESS,s2.id,{rfc:$('x-r').value,nombre:$('x-n').value,cp:$('x-c').value,uso:$('x-u').value});UI.msgFis={t:'ok',m:'Datos fiscales guardados.'}}catch(e){UI.msgFis={t:'err',m:e.message}}render();return}
  if(id==='f-con'){var okc=run(function(){Svc.conciliar(SESS,{referencia:$('k-r').value,monto:$('k-m').value,operacion:$('k-o').value,fecha:$('k-f').value})},'Pago conciliado.');if(okc)UI.msg=null;render();return}
});
document.addEventListener('click',function(ev){
  var tr=ev.target.closest('[data-fill]');if(tr){var p=tr.dataset.fill.split('|');$('lu').value=p[0];$('lp').value=p[1];return}
  var b=ev.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;UI.msg=null;UI.msgFis=null;
  if(a==='logout'){SESS=null;try{sessionStorage.removeItem('resitrack_sess')}catch(e){}UI={view:'home',tab:'tramite',pay:'tarjeta'};render();return}
  if(a==='go'){UI.view=b.dataset.v;render();return}
  if(a==='tab'){UI.tab=b.dataset.t;render();return}
  if(a==='paymode'){UI.pay=b.dataset.m;render();return}
  if(a==='ftab'){UI.ft=b.dataset.t;render();return}
  if(a==='sel'){UI.selected=+b.dataset.id;render();return}
  if(a==='dl'){toast('Descarga simulada: '+b.dataset.n+' (PDF)');return}
  var s=SESS&&SESS.rol==='residente'?solOf(SESS):null;
  if(a==='nuevaref'){run(function(){Svc.referencia(SESS,s.id)},'Nueva referencia generada.')}
  if(a==='ficha'){run(function(){Svc.pagarFicha(SESS,s.id)},'Pago informado. Queda en conciliación.')}
  if(a==='reenviar'){run(function(){Svc.reenviar(SESS,s.id)},'Solicitud reenviada a la coordinación.')}
  if(a==='facturar'){run(function(){Svc.factura(SESS,+b.dataset.id)},'Factura emitida (simulada).')}
  if(a==='constancia'){if(run(function(){Svc.constancia(SESS,+b.dataset.id)},'Constancia emitida.'))UI.selected=null}
  if(a==='carta'){if(run(function(){Svc.carta(SESS,+b.dataset.id)},'Carta emitida.'))UI.selected=null}
  if(a==='autorizar'){if(run(function(){Svc.decidir(SESS,+b.dataset.id,true)},'Solicitud autorizada.'))UI.selected=null}
  if(a==='rechazar'){if(run(function(){Svc.decidir(SESS,+b.dataset.id,false,$('mot').value)},'Solicitud devuelta al residente.'))UI.selected=null}
  render();
});
window.__RT={Svc:Svc,DB:function(){return DB},reset:function(){resetDb();SESS=null;render()},login:function(u,p){SESS=Svc.login(u,p);return SESS},sess:function(){return SESS},luhnDigit:luhnDigit,clock:clock};
if(!loadDb())seed();
render();
})();
</script>
